[package]
name = "rdplayer"
version = "1.0.0"
edition.workspace = true
rust-version.workspace = true
description = "A simple Jellyfin Client written by GTK4-RS"
license = "GPL-3.0"
publish = false

[dependencies]
gtk = { workspace = true, features = ["v4_22"] }
adw = { workspace = true, features = ["v1_9"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
reqwest = { workspace = true, features = [
  "http2",
  "rustls",
  "json",
  "query",
  "gzip",
] }
yzlm.workspace = true
once_cell.workspace = true
bytefmt.workspace = true
uuid = { workspace = true, features = ["v4"] }
chrono = { workspace = true, features = ["serde"] }
tracing.workspace = true
gst.workspace = true
url.workspace = true
gettext-rs = { workspace = true, features = ["gettext-system"] }
hostname.workspace = true
arc-swap.workspace = true
flume.workspace = true
derive_builder.workspace = true
anyhow.workspace = true
tracing-subscriber = { workspace = true, features = ["chrono", "env-filter"] }
regex.workspace = true
strsim.workspace = true
clap = { workspace = true, features = ["derive"] }
fnv.workspace = true
rand.workspace = true
base64.workspace = true
xxhash-rust = { workspace = true, features = ["xxh3"] }
futures-util.workspace = true
itertools.workspace = true
moka = { workspace = true, features = ["future"] }

mutsumi.workspace = true
dandanapi-client.workspace = true

[dev-dependencies]
cargo-husky = { workspace = true, features = ["user-hooks"] }

[features]
console = []
default = ["protocols", "render"]
protocols = []
render = []
build_libmpv = []

[target.'cfg(target_os = "linux")'.dependencies]
# glycin uses memfd/shm FD passing and is Linux-only; Windows builds fall
# back to GDK's built-in image loaders (see image_paintable.rs).
glycin = { version = "3.1.0", default-features = false, features = ["gdk4", "tokio"] }
mpris-server.workspace = true
gdk-x11 = { workspace = true, features = [
  "v4_18",
  "xlib",
] }
gdk-wayland = { workspace = true, features = [
  "v4_18",
  "wayland_crate",
] }
