<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>RDplayer application icon</title>
  <desc>RDplayer — a GTK media player. Rounded tile with a violet-to-rose gradient, an open playback ring and a solid play button.</desc>

  <defs>
    <linearGradient id="rdpBg" x1="14" y1="10" x2="114" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="rdpShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rdpTile">
      <rect x="4" y="4" width="120" height="120" rx="28"/>
    </clipPath>
  </defs>

  <!-- background tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#rdpBg)"/>
  <rect x="4" y="4" width="120" height="64" fill="url(#rdpShine)" clip-path="url(#rdpTile)"/>

  <!-- open playback ring (gap faces the play direction) -->
  <path d="M 96.2 91 A 42 42 0 1 1 96.2 37"
        fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" opacity="0.55"/>

  <!-- solid rounded play button -->
  <path d="M 55 44 L 87 64 L 55 84 Z"
        fill="#ffffff" stroke="#ffffff" stroke-width="10"
        stroke-linejoin="round"/>
</svg>
